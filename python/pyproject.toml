[build-system]
requires = [
  "setuptools>=64",
  "wheel",
  "cmdstanpy>=1.0.4",
]
build-backend = "setuptools.build_meta"

[project]
name = "neoprophet"
dynamic = ["version"]
description = "Prophet forecasting that is easier to use, clearer to read and faster at scale"
readme = "README.md"
keywords = ["forecasting", "time series", "prophet", "stan", "mlx"]
requires-python = ">=3.10"
dependencies = [
  "cmdstanpy>=1.0.4",
  "numpy>=1.21.6",
  "matplotlib>=3.5.3",
  "pandas>=1.3.5",
  "holidays>=0.25,<1",
  "tqdm>=4.63.2",
]
authors = [
  {name = "Sean J. Taylor", email = "sjtz@pm.me"},
  {name = "Ben Letham", email = "bletham@fb.com"},
]
maintainers = [
  {name = "Behnam"},
]
license = {text = "MIT"}
classifiers = [
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
  "setuptools>=64",
  "wheel",
  "pytest",
  "jupyterlab",
  "nbconvert",
  "plotly",
  "pyrefly==0.50.0",
  "ipykernel",
  "ipywidgets",
]
mlx = [
  "mlx>=0.32.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
parallel = [
  "dask[dataframe]",
  "distributed",
]

[project.urls]
Homepage = "https://github.com/CodeWithBehnam/NeoProphet"
Repository = "https://github.com/CodeWithBehnam/NeoProphet"
Issues = "https://github.com/CodeWithBehnam/NeoProphet/issues"
"Upstream documentation" = "https://facebook.github.io/prophet/"


[tool.pyrefly]
project-includes = ["prophet"]
project-excludes = ["prophet/tests"]  # todo: 131 errors
python-version = "3.10"
