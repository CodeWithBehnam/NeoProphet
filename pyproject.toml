[project]
name = "neoprophet"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "prophet[mlx]",
]

[tool.uv.workspace]
members = [
    "python",
]

[tool.uv.sources]
prophet = { workspace = true, editable = true }

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "plotly>=7.1.0",
    "pyrefly==0.50.0",
    "pytest>=9.1.1",
]
